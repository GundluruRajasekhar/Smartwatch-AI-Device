const D=[[0,'This is ChronoFusion AI, an original smartwatch face for the theme Design Time Your Way. Obsidian black, brushed titanium and gold frame a large digital time that reads in one second, with date, weather, Bluetooth, notifications, heart rate, steps and battery around it.',()=>{F.mode(false);F.an(false);F.run(false);F.acc('gold')}],
[0,'Signature detail: the Aurum Eclipse disc at the top darkens like an eclipse as the day passes, while a gold comet travels around the seconds arc.'],
[0,'Switch to analog style and the same face shows sweeping hands, hour numerals and a date window.',()=>F.an(true)],
[0,'Five colourways, including a titanium silver edition, let wearers personalise the look.',()=>{F.an(false);['cyan','emerald','rose','titanium','gold'].forEach((c,i)=>setTimeout(()=>F.acc(c),i*1500))}],
[1,'The health page shows heart rate, blood oxygen, blood pressure, stress, sleep and body temperature at a glance.'],
[2,'Activity rings track steps, calories and distance against daily goals, and update live during a workout.',()=>F.run(true)],
[3,'Tools: a stopwatch and a five minute timer.',()=>{F.run(false);$('#sg').click()}],
[4,'A compass shows your heading, and a press and hold S O S button would alert emergency contacts. Here it is simulated.',()=>{$('#sg').click()}],
[5,'The weather page shows the current temperature, how it feels, an hourly outlook, and the day high and low.'],

[0,'Luxury design, smart health widgets, premium typography, a personalised experience and an optimised always-on display. Design Time Your Way. Thank you.',()=>F.mode(false)]];
let tour=false,tk=-1,td;
function step(i){if(!tour)return;if(i>=D.length)return stop('Tour finished.');tk=i;const d=D[i];F.mode(false);F.music(false);F.breathe(false);F.go(d[0]);try{d[2]&&d[2]()}catch(e){}
$('#cap').textContent=`${i+1}/${D.length}: ${d[1]}`;
const adv=()=>{if(tk===i&&tour){tk=-1;clearTimeout(td);setTimeout(()=>step(i+1),600)}};
try{const u=new SpeechSynthesisUtterance(d[1]);u.onend=adv;u.onerror=adv;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
clearTimeout(td);td=setTimeout(adv,d[1].length*95+3000)}
function stop(m){tour=false;tk=-1;clearTimeout(td);try{speechSynthesis.cancel()}catch(e){}$('#ts').disabled=false;$('#te').disabled=true;$('#cap').textContent=m||'Tour stopped.';F.mode(false);F.go(0);F.an(false);F.run(false);F.music(false);F.breathe(false)}
